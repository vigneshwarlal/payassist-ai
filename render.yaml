services:
  # 1. Full-Stack Web Service (Frontend + Express Backend)
  - type: web
    name: payassist-ai
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: GEMINI_API_KEY
        sync: false

  # 2. Autonomous Agent Sentinel Background Worker
  - type: worker
    name: payassist-sentinel-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: node server/services/sentinelService.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
